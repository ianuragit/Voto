name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # §7.4 — the air gap is a build-time guarantee, not a convention.
      # A module holding both database connections fails the build.
      - name: Air-gap check
        run: npm run check:airgap

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Appendix A acceptance criteria)
        run: npm test
