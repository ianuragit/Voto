name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Read from .nvmrc, never a literal. Railway resolves the same file, so
      # CI cannot go green on a Node version the deploy will not build on —
      # which is exactly how a broken build once passed CI.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # §7.4 — the air gap is a build-time guarantee, not a convention.
      # A module holding both database connections fails the build.
      - name: Air-gap check
        run: npm run check:airgap

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (Appendix A acceptance criteria)
        run: npm test
